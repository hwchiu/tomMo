openapi: 3.0.3
info:
  title: 廠務協調台 API
  version: 0.1.0
  description: |
    JSON contract for the factory coordination service. The Next.js client calls
    these paths through `src/api`. The GitHub Pages build keeps an in-browser
    mock (`NEXT_PUBLIC_USE_MOCK` is not `0`). The Go monolith serves the same
    paths from SQLite and a signed `fpm_session` cookie. Writes require the
    editor role. See docs/deployment-architecture.md.

    Dates are `YYYY-MM-DD`. Timestamps are ISO-8601. Construction windows are
    judged one product at a time against Phase 2 (產品建立). Overlapping windows
    between products are parallel work and are not conflicts. Only a missing
    window, or a window that starts before or ends after Phase 2, is flagged.
servers:
  - url: http://localhost:8080
    description: Go service
tags:
  - name: session
  - name: portfolio
  - name: factories
  - name: issues
  - name: products
  - name: plans
security:
  - session: []
paths:
  /healthz:
    get:
      tags: [session]
      security: []
      summary: Liveness and readiness
      operationId: healthz
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /api/v1/login:
    post:
      tags: [session]
      security: []
      summary: Local account login. Sets HttpOnly fpm_session.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401":
          description: Bad credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/logout:
    post:
      tags: [session]
      summary: Clear the session cookie. Either role may log out.
      operationId: logout
      responses:
        "200":
          description: Cookie cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /api/v1/people:
    get:
      tags: [session]
      summary: People directory. Fields shown in the admin UI are name and department.
      operationId: listPeople
      responses:
        "200":
          description: Directory
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Person" }
    post:
      tags: [session]
      summary: Add a manual person. Editor only.
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, department]
              properties:
                name: { type: string }
                department: { type: string }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/people/{id}:
    patch:
      tags: [session]
      summary: Update a manual person. External records return 400.
      operationId: updatePerson
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, department]
              properties:
                name: { type: string }
                department: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/bootstrap:
    get:
      tags: [session]
      summary: Current user, enumerations, and the demo as-of date
      operationId: getBootstrap
      responses:
        "200":
          description: Shell bootstrap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
  /api/v1/session:
    post:
      tags: [session]
      summary: Remember the acting user
      operationId: switchUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        "200":
          description: Switched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /api/v1/session/reset:
    post:
      tags: [session]
      summary: Restore demo fixtures for this session
      operationId: resetDemo
      responses:
        "200":
          description: Reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /api/v1/portfolio:
    get:
      tags: [portfolio]
      summary: Exception-first factory portfolio
      operationId: getPortfolio
      responses:
        "200":
          description: Counts, exceptions, factories, milestones, and plans waiting for approval
          content:
            application/json:
              schema:
                type: object
                required: [asOf, counts, exceptions, factories, milestones, pendingPlans]
                properties:
                  asOf: { type: string, format: date }
                  counts:
                    type: object
                    properties:
                      total: { type: integer }
                      onTrack: { type: integer }
                      atRisk: { type: integer }
                      delayed: { type: integer }
                  exceptions:
                    type: array
                    items: { $ref: "#/components/schemas/Exception" }
                  factories:
                    type: array
                    items: { $ref: "#/components/schemas/FactoryBoard" }
                  milestones: { type: array, items: { type: object } }
                  pendingPlans:
                    type: array
                    description: Submitted plans waiting for PM approval
                    items: { type: object }
  /api/v1/product-build:
    get:
      tags: [plans]
      summary: Factory by product matrix for Phase 2
      description: |
        Each cell includes deployment status, plan status, a version when the
        product is VERSIONED, owners,
        machine counts, and a construction-window check against that factory's
        Phase 2 dates. `windowState` is `MISSING`, `INSIDE`, or `OUTSIDE`.
        There is no overlap or conflict field. Parallel windows stay `INSIDE`
        when each one fits Phase 2.
      operationId: getProductBuild
      responses:
        "200":
          description: Products and one row per factory
          content:
            application/json:
              schema:
                type: object
                required: [asOf, products, rows]
                properties:
                  asOf: { type: string, format: date }
                  products: { type: array, items: { type: object } }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        factoryId: { type: string }
                        cells:
                          type: array
                          items: { $ref: "#/components/schemas/BuildCell" }
  /api/v1/factories:
    get:
      tags: [factories]
      summary: Factory directory
      operationId: listFactories
      responses:
        "200":
          description: Factories plus users and enumerations used by the directory
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { type: string, format: date }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FactoryBoard" }
    post:
      tags: [factories]
      summary: Create a factory and copy the four default phases
      operationId: createFactory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryWrite" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/factories/{factoryId}/topics:
    post:
      tags: [factories]
      summary: Add a discussion topic for one factory
      operationId: createTopic
      parameters:
        - $ref: "#/components/parameters/factoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopicWrite" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/topics/{topicId}:
    patch:
      tags: [factories]
      summary: Edit a factory discussion topic
      operationId: updateTopic
      parameters:
        - name: topicId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopicWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/factories/{factoryId}:
    get:
      tags: [factories]
      summary: Factory detail, phases, plans, deployments, and issues
      operationId: getFactory
      parameters:
        - $ref: "#/components/parameters/factoryId"
      responses:
        "200":
          description: Factory detail
          content:
            application/json:
              schema: { type: object }
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [factories]
      summary: Update factory attributes and planned end
      operationId: updateFactory
      parameters:
        - $ref: "#/components/parameters/factoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/FactoryWrite"
                - type: object
                  required: [plannedEnd]
                  properties:
                    plannedEnd: { type: string, format: date }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/factories/{factoryId}/phases:
    post:
      tags: [factories]
      summary: Add a phase to one factory
      operationId: createPhase
      parameters:
        - $ref: "#/components/parameters/factoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhaseWrite" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/phases/{phaseId}:
    patch:
      tags: [factories]
      summary: Edit one factory's phase copy
      operationId: updatePhase
      parameters:
        - $ref: "#/components/parameters/phaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhaseWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/phases/{phaseId}/milestones:
    post:
      tags: [factories]
      summary: Add a milestone
      operationId: createMilestone
      parameters:
        - $ref: "#/components/parameters/phaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneWrite" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, factoryId]
                properties:
                  id: { type: string }
                  factoryId: { type: string }
  /api/v1/milestones/{milestoneId}:
    patch:
      tags: [factories]
      summary: Update a milestone
      operationId: updateMilestone
      parameters:
        - name: milestoneId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  factoryId: { type: string }
  /api/v1/issues:
    get:
      tags: [issues]
      operationId: listIssues
      responses:
        "200":
          description: Issues, including an overdue flag against asOf
    post:
      tags: [issues]
      operationId: createIssue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueWrite" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/issues/{issueId}:
    get:
      tags: [issues]
      operationId: getIssue
      parameters:
        - name: issueId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Issue detail
    patch:
      tags: [issues]
      operationId: updateIssue
      parameters:
        - name: issueId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/products:
    get:
      tags: [products]
      operationId: listProducts
      responses:
        "200":
          description: Global product catalog
    post:
      tags: [products]
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformWrite" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/products/{productId}:
    get:
      tags: [products]
      operationId: getPlatform
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Product, versions, features, and per-factory deployments
    patch:
      tags: [products]
      operationId: updateProduct
      parameters:
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/capabilities:
    get:
      tags: [products]
      summary: Planned on/off feature matrix without requiring versions
      description: |
        Rows are factory × product. Columns are features. Each cell is the
        planned state: on, off, or unset. VERSIONED products derive the cell
        from the provided version plus feature changes. FEATURE_ONLY products
        use the plan's feature set. There is no version axis.
      operationId: getCapabilities
      responses:
        "200":
          description: Cells distinguish supported, desired, and actual
  /api/v1/deployments/{deploymentId}:
    get:
      tags: [products]
      operationId: getDeployment
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deployment editor payload
    patch:
      tags: [products]
      operationId: updateDeployment
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/factories/{factoryId}/products/{productId}/plan:
    get:
      tags: [plans]
      summary: Current plan, window check, and revision history
      operationId: getPlan
      parameters:
        - $ref: "#/components/parameters/factoryId"
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: |
            Includes `windowState` and `windowReasons`. Reasons are only
            `MISSING_DATES`, `MISSING_PHASE`, `STARTS_BEFORE_PHASE`, and
            `ENDS_AFTER_PHASE`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanPage" }
    put:
      tags: [plans]
      summary: Save a draft or submit the current revision
      operationId: savePlan
      parameters:
        - $ref: "#/components/parameters/factoryId"
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/factories/{factoryId}/products/{productId}/plan/approve:
    post:
      tags: [plans]
      summary: Approve the current submitted plan
      operationId: approvePlan
      parameters:
        - $ref: "#/components/parameters/factoryId"
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/feature-diff:
    get:
      tags: [plans]
      summary: Feature changes between two versions of the same product
      operationId: featureDiff
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Added, removed, and changed features
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items: { $ref: "#/components/schemas/FeatureChange" }
  /api/v1/activity:
    get:
      tags: [portfolio]
      operationId: listActivity
      responses:
        "200":
          description: Append-only activity
  /api/v1/machine-types:
    post:
      tags: [session]
      summary: Add a machine type
      operationId: createMachineType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string, example: 機種C }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/machine-types/{machineTypeId}:
    patch:
      tags: [session]
      summary: Rename or deactivate a machine type
      operationId: updateMachineType
      parameters:
        - name: machineTypeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, active]
              properties:
                name: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/enumerations:
    post:
      tags: [session]
      operationId: createEnumeration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [set, code, label, description]
              properties:
                set: { $ref: "#/components/schemas/EnumSet" }
                code: { type: string }
                label: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
  /api/v1/enumerations/{enumerationId}:
    patch:
      tags: [session]
      operationId: updateEnumeration
      parameters:
        - name: enumerationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, description, active]
              properties:
                label: { type: string }
                description: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: fpm_session
      description: HMAC-signed session. Editor may write; viewer is read-only.
  parameters:
    factoryId:
      name: factoryId
      in: path
      required: true
      schema: { type: string }
    phaseId:
      name: phaseId
      in: path
      required: true
      schema: { type: string }
    productId:
      name: productId
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
  schemas:
    Ok:
      type: object
      properties:
        ok: { type: boolean }
    Id:
      type: object
      required: [id]
      properties:
        id: { type: string }
    EnumSet:
      type: string
      enum: [factoryCategory, factoryRegion, technologyNode]
    FactoryStatus:
      type: string
      enum: [ON_TRACK, AT_RISK, DELAYED, COMPLETED]
    PhaseStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, AT_RISK, DELAYED, COMPLETED]
    PlanStatus:
      type: string
      enum: [NOT_SUBMITTED, SUBMITTED, APPROVED]
    DeploymentStatus:
      type: string
      enum: [PLANNED, IN_PROGRESS, DEPLOYED, ACCEPTED]
    WindowState:
      type: string
      enum: [MISSING, INSIDE, OUTSIDE]
    WindowReason:
      type: string
      enum: [MISSING_DATES, MISSING_PHASE, STARTS_BEFORE_PHASE, ENDS_AFTER_PHASE]
    ProductMode:
      type: string
      enum: [VERSIONED, FEATURE_ONLY]
      description: VERSIONED plans choose a release. FEATURE_ONLY plans set each feature on or off.
    ChangeType:
      type: string
      enum: [ADDED, REMOVED, CHANGED]
    Person:
      type: object
      required: [id, name, department, active, source]
      properties:
        id: { type: string }
        name: { type: string }
        department: { type: string }
        active: { type: boolean }
        source: { type: string, enum: [manual, external] }
        externalId: { type: string, nullable: true, description: Future OIDC sub or employee id }
    Bootstrap:
      type: object
      properties:
        asOf: { type: string, format: date }
        role: { type: string, enum: [editor, viewer] }
        username: { type: string }
        actor: { $ref: "#/components/schemas/Person" }
        people: { type: array, items: { $ref: "#/components/schemas/Person" } }
        enumerations: { type: array, items: { type: object } }
    Exception:
      type: object
      properties:
        id: { type: string }
        rank: { type: integer }
        tone: { type: string, enum: [danger, warning, info] }
        title: { type: string }
        detail: { type: string }
        href: { type: string }
        factoryName: { type: string }
    FactoryBoard:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/FactoryStatus" }
        category: { type: string }
        region: { type: string }
        technology: { type: string }
        missingPlans: { type: integer }
        outsideWindows: { type: integer }
        notReady: { type: integer, description: Products whose plan is not ready for developer onboarding }
        openTopics: { type: integer, description: Topics still OPEN or IN_DISCUSSION }
        pmId: { type: string }
        pmName: { type: string }
        pmDepartment: { type: string }
        machineTotal: { type: integer, description: Sum of planned quantities across every product. Computed, never entered. }
        machineRollup: { type: array, items: { type: object } }
    TopicStatus:
      type: string
      enum: [OPEN, IN_DISCUSSION, RESOLVED, CLOSED]
    Topic:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        status: { $ref: "#/components/schemas/TopicStatus" }
        raisedOn: { type: string, format: date }
    TopicWrite:
      type: object
      required: [title, description, ownerId, status, raisedOn]
      properties:
        title: { type: string }
        description: { type: string }
        ownerId: { type: string }
        status: { $ref: "#/components/schemas/TopicStatus" }
        raisedOn: { type: string, format: date }
    FactoryWrite:
      type: object
      required: [code, name, location, description, category, region, technology, pmId, plannedStart, status]
      properties:
        code: { type: string }
        name: { type: string }
        location: { type: string }
        description: { type: string }
        category: { type: string, description: Enumeration code in factoryCategory }
        region: { type: string, description: Enumeration code in factoryRegion }
        technology: { type: string, description: Enumeration code in technologyNode }
        pmId: { type: string }
        plannedStart: { type: string, format: date }
        status: { $ref: "#/components/schemas/FactoryStatus" }
    PhaseWrite:
      type: object
      required: [name, order, ownerId, plannedStart, plannedEnd, status, riskNote, dependsOnPhaseIds]
      properties:
        name: { type: string }
        order: { type: integer }
        ownerId: { type: string }
        plannedStart: { type: string, format: date }
        plannedEnd: { type: string, format: date }
        actualStart: { type: string, format: date, nullable: true }
        actualEnd: { type: string, format: date, nullable: true }
        status: { $ref: "#/components/schemas/PhaseStatus" }
        riskNote: { type: string }
        dependsOnPhaseIds:
          type: array
          items: { type: string }
    MilestoneWrite:
      type: object
      required: [name, dueDate, deliverables, ownerId, done]
      properties:
        name: { type: string }
        dueDate: { type: string, format: date }
        deliverables: { type: string }
        ownerId: { type: string }
        done: { type: boolean }
    IssueWrite:
      type: object
      required: [title, description, factoryId, ownerId, severity, priority, status]
      properties:
        title: { type: string }
        description: { type: string }
        factoryId: { type: string }
        phaseId: { type: string, nullable: true }
        productId: { type: string, nullable: true }
        ownerId: { type: string }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        priority: { type: string, enum: [P0, P1, P2, P3] }
        status: { type: string, enum: [OPEN, IN_PROGRESS, BLOCKED, RESOLVED, CLOSED] }
        dueDate: { type: string, format: date, nullable: true }
        resolution: { type: string }
    PlatformWrite:
      type: object
      required: [code, name, description, devDepartment, projectDepartment, primaryOwnerId, mode]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        devDepartment: { type: string }
        projectDepartment: { type: string }
        primaryOwnerId: { type: string }
        mode: { $ref: "#/components/schemas/ProductMode" }
    DeploymentWrite:
      type: object
      properties:
        plannedVersionId: { type: string, nullable: true }
        actualVersionId: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/DeploymentStatus" }
        secondaryOwnerId: { type: string }
        plannedDate: { type: string, format: date, nullable: true }
        deployedAt: { type: string, format: date, nullable: true }
        notes: { type: string }
        links:
          type: array
          items:
            type: object
            properties:
              phaseId: { type: string }
              relation: { type: string, enum: [INTRODUCED, UPGRADED, ACCEPTED] }
        features:
          type: array
          items:
            type: object
            properties:
              featureId: { type: string }
              desired: { type: boolean }
              actual: { type: boolean, nullable: true }
    PlannedMachine:
      type: object
      required: [machineTypeId, planned]
      properties:
        machineTypeId: { type: string }
        planned: { type: integer, minimum: 0, description: Planned quantity only }
    FeatureChange:
      type: object
      required: [featureId, changeType, summary]
      properties:
        featureId: { type: string }
        changeType: { $ref: "#/components/schemas/ChangeType" }
        summary: { type: string }
    PlanWrite:
      type: object
      required: [intent]
      properties:
        providedVersionId: { type: string, nullable: true, description: Required on submit when the product mode is VERSIONED. Null for FEATURE_ONLY. }
        plannedFeatures:
          type: array
          description: Full feature set for FEATURE_ONLY. Each item is enabled or disabled. 異動功能 is derived against the feature default.
          items:
            type: object
            required: [featureId, enabled]
            properties:
              featureId: { type: string }
              enabled: { type: boolean }
        featureChanges:
          type: array
          items: { $ref: "#/components/schemas/FeatureChange" }
        constructionStart: { type: string, format: date, nullable: true }
        constructionEnd: { type: string, format: date, nullable: true }
        machines:
          type: array
          description: Planned quantity per machine type. There is no actual or delivered count.
          items: { $ref: "#/components/schemas/PlannedMachine" }
        note: { type: string }
        intent: { type: string, enum: [draft, submit] }
    BuildCell:
      type: object
      properties:
        planStatus: { $ref: "#/components/schemas/PlanStatus" }
        deploymentStatus: { $ref: "#/components/schemas/DeploymentStatus" }
        windowState: { $ref: "#/components/schemas/WindowState" }
        windowReasons:
          type: array
          items: { $ref: "#/components/schemas/WindowReason" }
        ready: { type: boolean }
        flags:
          type: array
          items:
            type: string
            enum: [PLAN_MISSING, PLAN_NOT_APPROVED, WINDOW_MISSING, WINDOW_OUTSIDE, VERSION_MISSING, FEATURE_UNPLANNED]
    PlanPage:
      type: object
      properties:
        status: { $ref: "#/components/schemas/PlanStatus" }
        mode: { $ref: "#/components/schemas/ProductMode" }
        windowState: { $ref: "#/components/schemas/WindowState" }
        windowReasons:
          type: array
          items: { $ref: "#/components/schemas/WindowReason" }
        constructionStart: { type: string, format: date, nullable: true }
        constructionEnd: { type: string, format: date, nullable: true }
        canEdit: { type: boolean }
        canApprove: { type: boolean }
