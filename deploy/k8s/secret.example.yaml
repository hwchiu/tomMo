# Example only. Prefer creating the Secret with random values instead of applying this file:
#
#   kubectl create secret generic fpm-auth \
#     --from-literal=INITIAL_ADMIN_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=INITIAL_VIEWER_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 48)"
#
# Retrieve the initial passwords later:
#
#   kubectl get secret fpm-auth -o jsonpath='{.data.INITIAL_ADMIN_PASSWORD}' | base64 -d; echo
#   kubectl get secret fpm-auth -o jsonpath='{.data.INITIAL_VIEWER_PASSWORD}' | base64 -d; echo
#
# INITIAL_*_PASSWORD is used only when the account does not exist yet; changing it later
# does not overwrite a stored password. Do not commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: fpm-auth
type: Opaque
stringData:
  INITIAL_ADMIN_PASSWORD: change-me
  INITIAL_VIEWER_PASSWORD: change-me
  SESSION_SECRET: change-me
