apiVersion: apps/v1
kind: Deployment
metadata:
  name: fpm
  labels:
    app: fpm
spec:
  # One writer for the SQLite file on the single ReadWriteOnce volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fpm
  template:
    metadata:
      labels:
        app: fpm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fpm
          image: fpm:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: DATA_DIR
              value: /data
            - name: TMPDIR
              value: /tmp
            - name: PORT
              value: "8080"
            - name: ADMIN_USERNAME
              value: admin
            - name: VIEWER_USERNAME
              value: viewer
            - name: SEED_MODE
              value: none
            # Used only when the account does not exist yet (first start on an empty PVC).
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fpm-auth
                  key: INITIAL_ADMIN_PASSWORD
            # Used only when the account does not exist yet (first start on an empty PVC).
            - name: INITIAL_VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fpm-auth
                  key: INITIAL_VIEWER_PASSWORD
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: fpm-auth
                  key: SESSION_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fpm-data
        - name: tmp
          emptyDir: {}
