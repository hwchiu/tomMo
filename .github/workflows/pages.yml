name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate demo fixture
        run: go run ./cmd/fpmctl fixture -out src/mocks/demo.json
      - name: Build static export
        env:
          NEXT_PUBLIC_USE_MOCK: "1"
        run: npm run build
      - name: Check static export
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/login/index.html
          test -f out/admin/index.html
          test -f out/factories/index.html
          node -e 'const d=require("./src/mocks/demo.json"); const f=d.factories.find((x)=>x.name==="新竹一廠"); if(!f) process.exit(1); require("fs").writeFileSync("/tmp/fid", f.id)'
          test -f "out/factories/$(cat /tmp/fid)/index.html"
          test -f out/product-build/index.html
          test -f out/capabilities/index.html
          test -f out/issues/index.html
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
