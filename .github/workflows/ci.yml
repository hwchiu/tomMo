name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./internal/... ./cmd/...

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build static export
        env:
          NEXT_PUBLIC_USE_MOCK: "1"
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: make e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
      - name: Install kind and kubectl
        run: |
          curl -fsSL -o kind "https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64"
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/kind-up.sh scripts/kind-down.sh
      - name: kind-up
        env:
          CLUSTER_NAME: tommo
          IMAGE_TAG: ci
          PORT_FORWARD: "1"
          LOCAL_PORT: "8080"
        run: bash scripts/kind-up.sh
      - name: kind-up again
        env:
          CLUSTER_NAME: tommo
          IMAGE_TAG: ci
          PORT_FORWARD: "1"
          LOCAL_PORT: "8080"
        run: bash scripts/kind-up.sh
